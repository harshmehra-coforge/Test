<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Insurance Quote & FNOL</title><link rel="stylesheet" href="{{ url_for('web.static', filename='styles.css') }}"></head>
<body><main><h1>Auto Insurance Quote & FNOL</h1><p id="message" role="status"></p><section><h2>1. Get a quote</h2><form id="quote-form"><label>Driver age <input name="driver_age" type="number" min="0" required></label><label>Vehicle <select name="vehicle_type"><option value="sedan">Sedan</option><option value="suv">SUV</option><option value="sports">Sports</option></select></label><button>Calculate premium</button></form><pre id="quote-result"></pre></section><section><h2>2. Bind policy</h2><form id="policy-form"><label>Quote ID <input name="quote_id" required></label><label>Start <input name="coverage_start" type="date" required></label><label>End <input name="coverage_end" type="date" required></label><button>Bind policy</button></form><pre id="policy-result"></pre></section><section><h2>3. Submit FNOL</h2><form id="claim-form"><label>Policy ID <input name="policy_id" required></label><label>Loss date <input name="loss_date" type="date" required></label><label>Report date <input name="report_date" type="date" required></label><label>Description <textarea name="loss_description" minlength="10" maxlength="2000" required></textarea></label><button>Submit claim</button></form><pre id="claim-result"></pre></section><section><h2>4. View claim status</h2><form id="status-form"><label>Claim ID <input name="claim_id" required></label><button>Find claim</button></form><pre id="status-result"></pre></section></main><script src="{{ url_for('web.static', filename='app.js') }}"></script></body></html>
